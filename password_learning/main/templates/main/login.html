<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Password Manager Login</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f2f3f5; padding: 40px; }
    .card { max-width: 420px; margin: auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 12px 28px rgba(0,0,0,0.08); }
    input { width: 100%; padding: 10px 12px; margin: 6px 0 14px; border: 1px solid #ccc; border-radius: 6px; }
    button { width: 100%; padding: 10px 12px; border: none; background: #2d6cdf; color: #fff; border-radius: 6px; cursor: pointer; }
    .error { color: #b00020; margin-bottom: 12px; }
    .small { font-size: 0.9rem; color: #555; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h1 style="margin-top:0;">Login</h1>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <label for="uid">UID</label>
      <input id="uid" name="uid" type="text" placeholder="Jimmy" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="••••••••" required />

      <button type="submit">Sign in</button>
    </form>

    <p class="small">Use the credentials found in <code>master_login.json</code>.</p>
  </div>
</body>
</html>
